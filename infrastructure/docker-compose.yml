services:
  db:
    image: postgis/postgis:17-3.5
    container_name: geoia-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - geoia_postgres_data:/var/lib/postgresql/data
      - ./init/01-enable-postgis.sql:/docker-entrypoint-initdb.d/01-enable-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-test:
    image: postgis/postgis:17-3.5
    container_name: geoia-postgis-test
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:?Defina POSTGRES_TEST_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Defina POSTGRES_TEST_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:?Defina POSTGRES_TEST_DB no arquivo .env}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - geoia_postgres_test_data:/var/lib/postgresql/data
      - ./init/01-enable-postgis.sql:/docker-entrypoint-initdb.d/01-enable-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  geoia_postgres_data:
  geoia_postgres_test_data:
